services:
  - type: web
    name: talent-flow-api
    env: node
    region: oregon
    plan: starter
    buildCommand: |
      echo "Installing dependencies..."
      pnpm install --frozen-lockfile
      echo "Building shared packages..."
      pnpm --filter @repo/config build
      pnpm --filter @repo/types build
      pnpm --filter @repo/validators build
      echo "Generating Prisma client..."
      pnpm --filter @repo/database exec prisma generate
      echo "Running database migrations..."
      pnpm --filter @repo/database exec prisma migrate deploy
      echo "Building API..."
      pnpm --filter @repo/api build
    startCommand: node dist/main
    rootDir: apps/api
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: API_PREFIX
        value: api
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: REDIS_ENABLED
        value: true
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: LOG_LEVEL
        value: info
      - key: GEMINI_API_KEY
        sync: false
